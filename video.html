<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>فيديو — نور كيت</title>
    <meta name="theme-color" content="#b91c1c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/video.css" />
  </head>
  <body class="video-body">

    <!-- ═══ الهيدر 🔴 ═══ -->
    <header class="video-header">
      <div class="video-header-left">
        <a class="video-icon-btn" href="index.html" aria-label="رجوع">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <input type="text" class="video-title-input" id="video-title" value="فيديو بدون عنوان" />
      </div>

      <div class="video-header-right">
        <button class="video-icon-btn" id="video-save-btn" aria-label="حفظ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
        </button>
        <button class="video-icon-btn primary" id="video-export-btn" aria-label="تصدير">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- ═══ مساحة العمل ═══ -->
    <main class="video-main">

      <!-- ═══ المعاينة ═══ -->
      <div class="video-preview-wrapper">
        <div class="video-preview" id="video-preview">
          <div class="video-bg" id="video-bg"></div>
          <div class="video-text" id="video-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
          
          <button class="video-play-btn" id="video-play-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>

          <div class="video-progress-bar">
            <div class="video-progress" id="video-progress"></div>
          </div>
        </div>
      </div>

      <!-- ═══ الجدول الزمني (Timeline) ═══ -->
      <div class="video-timeline" id="video-timeline">
        
        <!-- شريط التمرير (Playhead) -->
        <div class="video-playhead" id="video-playhead"></div>

        <!-- مسار الصوت -->
        <div class="video-track" data-track="audio">
          <div class="video-track-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
          <div class="video-track-content" id="track-audio">
            <div class="video-track-empty">اسحب ملفاً هنا</div>
          </div>
        </div>

        <!-- مسار الصورة -->
        <div class="video-track" data-track="image">
          <div class="video-track-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="video-track-content" id="track-image">
            <div class="video-track-empty">اسحب صورة هنا</div>
          </div>
        </div>

        <!-- مسار النص -->
        <div class="video-track" data-track="text">
          <div class="video-track-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 7 4 4 20 4 20 7"></polyline>
              <line x1="9" y1="20" x2="15" y2="20"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
            </svg>
          </div>
          <div class="video-track-content" id="track-text">
            <div class="video-track-empty">أضف نصاً</div>
          </div>
        </div>

      </div>

      <!-- ═══ شريط الأدوات 🔴 ═══ -->
      <div class="video-toolbar">
        <button class="video-tool-btn" data-video-tool="audio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <span>الصوت</span>
        </button>

        <button class="video-tool-btn" data-video-tool="image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>الصورة</span>
        </button>

        <button class="video-tool-btn" data-video-tool="text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
          <span>النص</span>
        </button>

        <button class="video-tool-btn" data-video-tool="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>إعدادات</span>
        </button>
      </div>

      <!-- ═══ لوحة الخيارات ═══ -->
      <div class="video-panel" id="video-panel" hidden>
        <div class="video-panel-header">
          <button class="video-panel-close" id="video-panel-close">✕</button>
          <span class="video-panel-title" id="video-panel-title">خيارات</span>
          <span class="video-panel-spacer"></span>
        </div>
        <div class="video-panel-content" id="video-panel-content"></div>
      </div>

    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/video-exporter.js"></script>
<script src="js/video.js"></script>
  </body>
  </html>
